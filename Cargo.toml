[package]
name = "cheesecake"
version = "0.4.0"
description = "Cheesecake CLI tool"
edition = "2024"

[[bin]]
name = "cake"
path = "src/main.rs"

[profile.release]
opt-level = "s"
strip = true
lto = "thin"

[dependencies]
anyhow = "^1.0"
clap = { version = "^4.5", features = ["derive"] }
dirs = "^7.0"
git2 = "^0.21"
indicatif = "^0.18"
lightningcss = "1.0.0-alpha.71"
minify-html = "^0.18"
minify-js = "^0.6"
serde = { version = "^1.0", features = ["derive"] }
toml = "^1.2"
